name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Test (Rust, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --workspace

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  build:
    name: Build Binary
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build binary (release)
        run: cargo build --release --package cloudseed-cli

      - name: Verify binary
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            ./target/release/cloudseed-cli.exe --help
          else
            ./target/release/cloudseed-cli --help
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudseed-${{ matrix.os }}
          path: target/release/
          retention-days: 7

  release:
    name: Create Release
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudseed-ubuntu-latest
          path: dist/linux

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cloudseed-windows-latest
          path: dist/windows

      - name: Prepare release binaries
        run: |
          mkdir -p dist/release
          cp dist/linux/cloudseed-cli dist/release/cloudseed
          cp dist/windows/cloudseed-cli.exe dist/release/cloudseed.exe

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^## \\[' CHANGELOG.md | head -1 | sed -E 's/## \\[([^]]+)\\].*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: CloudSeed ${{ steps.version.outputs.version }}
          body_path: CHANGELOG.md
          files: |
            dist/release/cloudseed
            dist/release/cloudseed.exe
          draft: false
          prerelease: false
