name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release (e.g., v2.1.6)'
        required: true
        default: 'v2.1.6'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build CLI binary (release)
        run: cargo build --release --package cloudseed-cli
      - name: Create ZIP archive
        id: zip
        run: |
          mkdir -p dist
          cp target/release/cloudseed-cli dist/cloudseed
          cd dist
          zip ../cloudseed-linux-x86_64.zip cloudseed
          cd ..
          echo "zip_path=cloudseed-linux-x86_64.zip" >> $GITHUB_OUTPUT
          echo "asset_name=cloudseed-linux-x86_64.zip" >> $GITHUB_OUTPUT
      - name: Generate Changelog
        id: changelog
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=${TAG_NAME#v}
          ESCAPED_VERSION=$(echo "$VERSION" | sed 's/\./\\./g')
          CHANGELOG=$(awk -v ver="\[${ESCAPED_VERSION}\]" '
            $0 ~ "^## " ver { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release and Upload Linux Asset
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: ${{ steps.zip.outputs.zip_path }}

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build CLI binary (release)
        run: cargo build --release --package cloudseed-cli
      - name: Create ZIP archive
        id: zip
        run: |
          mkdir -p dist
          copy target\release\cloudseed-cli.exe dist\cloudseed.exe
          cd dist
          7z a ..\cloudseed-windows-x86_64.zip cloudseed.exe
          cd ..
          echo "zip_path=cloudseed-windows-x86_64.zip" >> $env:GITHUB_OUTPUT
          echo "asset_name=cloudseed-windows-x86_64.zip" >> $env:GITHUB_OUTPUT
        shell: powershell
      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.release_tag }}
          files: ${{ steps.zip.outputs.zip_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}