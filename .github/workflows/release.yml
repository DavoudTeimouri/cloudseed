name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release (e.g., v0.2.1)'
        required: true
        default: 'v0.2.1'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build portable binary
        run: python build_dist.py
      - name: Create ZIP archive
        id: zip
        run: |
          cd dist
          zip ../cloudseed-linux-x86_64.zip cloudseed
          cd ..
          echo "zip_path=cloudseed-linux-x86_64.zip" >> $GITHUB_OUTPUT
          echo "asset_name=cloudseed-linux-x86_64.zip" >> $GITHUB_OUTPUT
      - name: Generate Changelog
        id: changelog
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          ESCAPED_TAG=$(echo "$TAG_NAME" | sed 's/\./\\./g')
          CHANGELOG=$(awk -v tag="$ESCAPED_TAG" '
            $0 ~ "^## \\[" tag "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create Release and Upload Linux Asset
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Release ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.changelog }}
          draft: false
          prerelease: false
          files: ${{ steps.zip.outputs.zip_path }}
          file_name: ${{ steps.zip.outputs.asset_name }}

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyInstaller
        run: pip install pyinstaller
      - name: Build portable binary
        run: python build_dist.py
      - name: Create ZIP archive
        id: zip
        run: |
          cd dist
          7z a ../cloudseed-windows-x86_64.zip cloudseed.exe
          cd ..
          echo "zip_path=cloudseed-windows-x86_64.zip" >> $env:GITHUB_OUTPUT
          echo "asset_name=cloudseed-windows-x86_64.zip" >> $env:GITHUB_OUTPUT
        shell: powershell
      - name: Upload Windows Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-linux.outputs.release_tag }}
          files: ${{ steps.zip.outputs.zip_path }}
          file_name: ${{ steps.zip.outputs.asset_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}