name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag release (e.g., v2.2.0 or v2.2.0-rc.1)'
        required: true
        default: 'v2.2.0'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ github.event.inputs.tag || github.ref_name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}
      version: ${{ steps.version.outputs.base }}
      linux_sha: ${{ steps.zip.outputs.linux_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build CLI binary (release)
        run: cargo build --release --package cloudseed-cli
      - name: Create ZIP archive
        id: zip
        run: |
          mkdir -p dist
          cp target/release/cloudseed-cli dist/cloudseed
          cd dist
          zip ../cloudseed-linux-x86_64.zip cloudseed
          cd ..
          sha=$(sha256sum cloudseed-linux-x86_64.zip | awk '{print $1}')
          echo "zip_path=cloudseed-linux-x86_64.zip" >> $GITHUB_OUTPUT
          echo "linux_sha=$sha" >> $GITHUB_OUTPUT
      - name: Resolve version
        id: version
        run: |
          TAG_NAME="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION=${TAG_NAME#v}
          # A tag with a suffix (2.2.0-rc.1) is a pre-release; the plain
          # version (2.2.0) is the stable one.
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)    PRERELEASE=false ;;
          esac
          # A pre-release cannot be the latest release, and the API rejects
          # the request outright if make_latest is left at its default.
          if [ "$PRERELEASE" = "true" ]; then
            MAKE_LATEST=false
          else
            MAKE_LATEST=true
          fi
          # The changelog section is keyed by the plain version, so the
          # pre-release suffix is stripped for the lookup.
          BASE=${VERSION%%-*}
          echo "prerelease=$PRERELEASE" >> $GITHUB_OUTPUT
          echo "make_latest=$MAKE_LATEST" >> $GITHUB_OUTPUT
          echo "base=$BASE" >> $GITHUB_OUTPUT
      - name: Generate Changelog
        run: |
          BASE="${{ steps.version.outputs.base }}"
          # index() is a literal substring match, so this works the same under
          # gawk and mawk. A regex here breaks under gawk, which processes
          # escape sequences in -v assignments and would turn the escaped
          # pattern into a character class that never matches.
          awk -v base="$BASE" '
            index($0, "## [" base "]") == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > changelog.md
          if [ ! -s changelog.md ]; then
            echo "::error::no changelog section found for version $BASE"
            exit 1
          fi
      - name: Build the release payload
        run: |
          python3 scripts/make-release-payload.py \
            --tag "${{ github.event.inputs.tag || github.ref_name }}" \
            --prerelease "${{ steps.version.outputs.prerelease }}" \
            --make-latest "${{ steps.version.outputs.make_latest }}" \
            --changelog changelog.md \
            --out release.json
      - name: Create the release
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # A previous run may have left a release behind for this tag.
          existing=$(gh api "repos/${{ github.repository }}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" || true)
          if [ -n "$existing" ]; then
            echo "Removing the existing release $existing for $TAG"
            gh api --method DELETE "repos/${{ github.repository }}/releases/$existing"
          fi
          gh api --method POST "repos/${{ github.repository }}/releases" --input release.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload the Linux asset
        run: gh release upload "${{ github.event.inputs.tag || github.ref_name }}" "${{ steps.zip.outputs.zip_path }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    needs: build-linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build CLI binary (release)
        run: cargo build --release --package cloudseed-cli
      - name: Create ZIP archive
        id: zip
        run: |
          mkdir -p dist
          copy target\release\cloudseed-cli.exe dist\cloudseed.exe
          cd dist
          7z a ..\cloudseed-windows-x86_64.zip cloudseed.exe
          cd ..
          echo "zip_path=cloudseed-windows-x86_64.zip" >> $env:GITHUB_OUTPUT
          $sha = (Get-FileHash cloudseed-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          echo "windows_sha=$sha" >> $env:GITHUB_OUTPUT
        shell: powershell
      - name: Upload the Windows asset
        run: gh release upload "${{ needs.build-linux.outputs.release_tag }}" "${{ steps.zip.outputs.zip_path }}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The checksum file lets a user verify the download. It is written on
      # the windows job, which is the last one to finish, so both archives
      # exist by then. The hashes come from the two uploads, so the file is
      # generated from the real artifacts and not from a second build.
      - name: Generate SHA256SUMS
        shell: bash
        run: |
          linux_zip="cloudseed-linux-x86_64.zip"
          windows_zip="cloudseed-windows-x86_64.zip"
          linux_sha="${{ needs.build-linux.outputs.linux_sha }}"
          windows_sha="${{ steps.zip.outputs.windows_sha }}"
          if [ -z "$linux_sha" ] || [ -z "$windows_sha" ]; then
            echo "::error::missing a SHA256 for SHA256SUMS"
            exit 1
          fi
          # The standard format for `sha256sum -c`: hash, two spaces, filename.
          printf '%s  %s\n%s  %s\n' "$linux_sha" "$linux_zip" "$windows_sha" "$windows_zip" > SHA256SUMS
          cat SHA256SUMS

      - name: Upload the checksums asset
        run: gh release upload "${{ needs.build-linux.outputs.release_tag }}" "SHA256SUMS" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
