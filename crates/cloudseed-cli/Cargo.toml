[package]
name = "cloudseed-cli"
version = "2.2.0-rc.5"
edition = "2021"

[dependencies]
cloudseed-core = { path = "../cloudseed-core" }
cloudseed-providers = { path = "../cloudseed-providers" }
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "json"] }
anyhow = "1.0"
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = "0.28"

[dev-dependencies]
serde_yaml = "0.9"
