[package]
name = "cloudseed-cli"
version = "2.1.8"
edition = "2021"

[dependencies]
cloudseed-core = { path = "../cloudseed-core" }
cloudseed-providers = { path = "../cloudseed-providers" }
clap = { version = "4.0", features = ["derive"] }
clap_complete = "4.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
anyhow = "1.0"
ratatui = { version = "0.26", features = ["crossterm"] }
crossterm = "0.28"
