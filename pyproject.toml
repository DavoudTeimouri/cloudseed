[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudseed"
version = "1.3.0"
description = "CloudSeed - Generate cloud-init / Cloudbase-Init VM templates for vSphere and KVM (Linux + Windows). Config-only, no ISO. Zero dependencies (stdlib only)."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Davoud Teimouri", email = "davoud@teimouri.com" }
]
maintainers = [
    { name = "Davoud Teimouri", email = "davoud@teimouri.com" }
]
keywords = [
    "cloud-init",
    "cloudbase-init",
    "vsphere",
    "kvm",
    "vm",
    "provisioning",
    "sysprep",
    "infrastructure-as-code",
    "vm-template",
    "golden-image"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.optional-dependencies]
build = ["pyinstaller>=5.0"]

[project.scripts]
cloudseed = "cloudseed.cli:main"

[tool.setuptools]
packages = ["cloudseed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
