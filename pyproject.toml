[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudseed"
version = "2.0.4"
description = "CloudSeed - Generate cloud-init / Cloudbase-Init VM templates for vSphere and KVM (Linux + Windows). Zero dependencies (stdlib only)."
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Davoud Teimouri", email = "davoud@teimouri.com" }
]
maintainers = [
    { name = "Davoud Teimouri", email = "davoud@teimouri.com" }
]
keywords = [
    "cloud-init",
    "cloudbase-init",
    "vsphere",
    "kvm",
    "vm",
    "provisioning",
    "sysprep",
    "infrastructure-as-code",
    "vm-template",
    "golden-image"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Installation/Setup",
    "Topic :: System :: Systems Administration",
    "Topic :: Utilities",
]

[project.optional-dependencies]
build = ["pyinstaller>=5.0"]
dev = ["pytest", "ruff", "mypy"]

[project.scripts]
cloudseed = "cloudseed.cli:main"

[tool.setuptools]
packages = ["cloudseed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py38"
select = ["E", "F", "I", "W", "UP", "B", "C4", "SIM", "T20"]
ignore = ["E501", "B008"]
exclude = [".venv", "dist", "build", "__pycache__", ".pytest_cache", "cloudseed.egg-info", "cloudseed-out", "N"]

[tool.ruff.per-file-ignores]
"cloudseed/__init__.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["cloudseed"]

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
ignore_missing_imports = true
